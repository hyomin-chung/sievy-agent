name: Bug
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["type: bug"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken or unexpected?
      placeholder: Describe the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can this be reproduced?
      placeholder: |
        1. 
        2. 
        3.
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local
        - Cloud Run
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Error messages, screenshots, logs, URLs, or other evidence
      placeholder: |
        Paste relevant evidence here.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional context, suspected cause, or possible fix
      placeholder: |
        -
    validations:
      required: false
