services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    env_file:
      - path: .env
        required: false
    environment:
      - ELASTIC_URL=http://elastic:9200
    depends_on:
      elastic:
        condition: service_healthy
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/app/.pnpm-store
    env_file:
      - path: .env
        required: false
    environment:
      - CI=true
    command: pnpm dev --host

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic:9200
    depends_on:
      - elastic

  elastic-mcp:
    image: docker.elastic.co/mcp/elasticsearch
    command: http
    ports:
      - "8080:8080"
    environment:
      - ES_URL=http://elastic:9200
      - MCP_API_KEY=sievy-dev-key
    depends_on:
      elastic:
        condition: service_healthy

volumes:
  elastic_data:
  backend_venv:
  frontend_node_modules:
  frontend_pnpm_store:
