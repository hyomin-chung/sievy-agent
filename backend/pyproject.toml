[project]
name = "sievy-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-adk>=1.0.0",
    "google-cloud-firestore>=2.16.0",
    "firebase-admin>=6.5.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "elasticsearch>=8.13.0",
    "firecrawl-py>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["api", "agents", "connectors", "schemas", "store", "feed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
